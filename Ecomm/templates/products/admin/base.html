<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Admin Panel{% endblock %} - BlueWave Solutions
    </title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <style>
      .sidebar {
        background-color: #2c3e50;
        min-height: 100vh;
        padding: 0;
      }

      .sidebar a {
        color: #ecf0f1;
        text-decoration: none;
        padding: 15px 20px;
        display: block;
        transition: all 0.3s;
      }

      .sidebar a:hover,
      .sidebar a.active {
        background-color: #34495e;
        color: #3498db;
      }

      .main-content {
        background-color: #f8f9fa;
        min-height: 100vh;
      }

      .navbar-brand {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'core:dashboard' %}">
          <i class="fas fa-tint me-2"></i>BlueWave Admin
        </a>

        <div class="navbar-nav ms-auto">
          <a
            class="nav-link"
            href="{% url 'core:landing_page' %}"
            target="_blank"
          >
            <i class="fas fa-external-link-alt me-1"></i>View Site
          </a>
          <a class="nav-link" href="{% url 'logout_view' %}">
            <i class="fas fa-sign-out-alt me-1"></i>Logout
          </a>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-0">
      <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
          <div class="pt-3">
            <a
              href="{% url 'core:admin_dashboard' %}"
              class="{% if section == 'dashboard' %}active{% endif %}"
            >
              <i class="fas fa-tachometer-alt me-2"></i>Dashboard
            </a>
            <a
              href="{% url 'products:admin_product_list' %}"
              class="{% if section == 'products' %}active{% endif %}"
            >
              <i class="fas fa-box me-2"></i>Products
            </a>
            <a href="{% url 'products:admin_product_upload' %}">
              <i class="fas fa-plus me-2"></i>Add Product
            </a>
            <a href="{% url 'products:admin_category_management' %}">
              <i class="fas fa-tags me-2"></i>Categories
            </a>
            <a
              href="{% url 'orders:admin_order_list' %}"
              class="{% if section == 'orders' %}active{% endif %}"
            >
              <i class="fas fa-shopping-cart me-2"></i>Orders
            </a>
            <a
              href="{% url 'subscriptions:admin_subscription_list' %}"
              class="{% if section == 'subscriptions' %}active{% endif %}"
            >
              <i class="fas fa-database me-2"></i>Subscriptions
            </a>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">
          {% if messages %}
          <div class="container-fluid mt-3">
            {% for message in messages %}
            <div
              class="alert alert-{{ message.tags }} alert-dismissible fade show"
              role="alert"
            >
              {{ message }}
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="alert"
              ></button>
            </div>
            {% endfor %}
          </div>
          {% endif %} {% block content %} {% endblock %}
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
